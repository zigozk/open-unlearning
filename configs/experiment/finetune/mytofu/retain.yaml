# @package _global_

defaults:
  - override /model: Llama-3.2-1B-Instruct
  - override /trainer: finetune
  - override /data/datasets@data.train: MYTOFU_retain
  - override /eval: null

mode: finetune

trainer:
  args:
    learning_rate: 2e-5
    weight_decay: 0.01
    warmup_epochs: 1.0
    num_train_epochs: 5

task_name: mytofu_Llama-3.2-1B-Instruct_retain